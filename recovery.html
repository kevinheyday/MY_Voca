<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAYWARD Recovery v5.4.60</title><style>body{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#f6f8fc;color:#172033;margin:0}.w{max-width:560px;margin:auto;padding:24px}.c{background:#fff;border:1px solid #e6eaf0;border-radius:20px;padding:22px;box-shadow:0 10px 30px #10204012}button{border:0;border-radius:12px;background:#2563eb;color:#fff;padding:12px 16px;font-weight:800}pre{white-space:pre-wrap;word-break:break-word;background:#f9fafb;padding:12px;border-radius:12px}</style></head><body><div class="w"><div class="c"><h2>SAYWARD Recovery v5.4.60</h2><p>정상 앱 시작에서는 이 페이지를 사용하지 않습니다. 과거 Service Worker/Cache가 남은 특수한 경우에만 수동 복구합니다. 학습기록(localStorage)은 삭제하지 않습니다.</p><button id="go">Service Worker / SAYWARD Cache 정리</button><pre id="out">대기 중</pre></div></div><script>const o=document.getElementById('out');document.getElementById('go').onclick=async()=>{const log=[];try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();log.push('registrations before='+regs.length);for(const r of regs){try{await r.unregister()}catch(e){log.push('unregister error '+e)}}}else log.push('serviceWorker API 없음')}catch(e){log.push('SW error '+e)}try{if('caches'in window){const keys=await caches.keys();const targets=keys.filter(k=>/^sayward/i.test(k));log.push('sayward caches before='+targets.length);for(const k of targets){try{await caches.delete(k)}catch(e){log.push('cache delete error '+e)}}}}catch(e){log.push('Cache error '+e)}log.push('완료. Chrome 탭을 닫고 SAYWARD를 다시 여세요.');o.textContent=log.join('\n')};</script></body></html>
