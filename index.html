<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7fb">
<meta name="sayward-version" content="v5.4.62">
<meta name="sayward-build" content="20261008-v5.4.62-atomic-home">
<title>SAYWARD v5.4.62</title>
<style>
html,body{margin:0;min-height:100%;background:#f4f7fb;color:#13213c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
a{color:inherit}
#atomicHome{display:block;min-height:100vh;padding:10px 9px 28px}
.shell{width:min(100%,760px);margin:0 auto}
.hero{position:relative;display:block;width:100%;min-height:118px;border-radius:18px;overflow:hidden;background:#172a48;color:#fff;box-shadow:0 8px 20px rgba(15,28,75,.10)}
.hero picture,.hero img{display:block;width:100%;height:auto;min-height:118px;object-fit:cover}
.heroFallback{position:absolute;left:14px;bottom:13px;z-index:2;text-shadow:0 1px 3px rgba(0,0,0,.38)}
.heroFallback b{display:block;font-size:18px;line-height:1.1}.heroFallback span{display:block;margin-top:4px;font-size:10px;opacity:.92}
.version{position:absolute;right:10px;top:9px;z-index:3;padding:3px 8px;border-radius:999px;background:#4d3eca;color:#fff;font-size:9px;font-weight:800}
.modeGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:11px}
.mode{display:flex;min-height:78px;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-decoration:none;border:1px solid #dfe5ee;border-radius:16px;background:#fff;box-shadow:0 5px 14px rgba(31,50,95,.05)}
.modeIcon{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#f4f6fb;font-size:22px;line-height:1}.mode b{font-size:10.5px;white-space:nowrap}
.primary{display:flex;align-items:center;min-height:58px;margin-top:9px;padding:0 15px;text-decoration:none;border-radius:16px;background:#182b49;color:#fff;box-shadow:0 7px 17px rgba(18,34,74,.12)}
.primary .play{display:grid;place-items:center;width:29px;height:29px;margin-right:11px;border:1px solid #5f83ac;border-radius:50%;background:#24496f;font-size:11px}.primary strong{font-size:13px}.primary small{display:block;margin-top:3px;font-size:9px;opacity:.75}
.today{display:grid;grid-template-columns:42px repeat(3,minmax(0,1fr)) minmax(118px,1.35fr);gap:6px;align-items:stretch;margin-top:10px;padding:9px;border:1px solid #e0e6ee;border-radius:17px;background:#fff;box-shadow:0 6px 17px rgba(15,28,75,.045)}
.todayLabel{display:grid;place-items:center;font-size:12px;font-weight:800}.stat{display:grid;place-items:center;align-content:center;padding:6px 2px;border:1px solid #edf0f4;border-radius:12px;background:#fbfcfe}.stat b{font-size:16px}.stat span{margin-top:4px;font-size:8.8px;color:#98a2b3}.todayStart{display:grid;place-items:center;text-decoration:none;border-radius:999px;background:#11183d;color:#fff;font-size:11px;font-weight:800;text-align:center;padding:0 7px}
.dayLink{display:block;position:relative;margin-top:10px;padding:14px 42px 15px 15px;text-decoration:none;border:1px solid #e0e6ee;border-radius:17px;background:#fff;box-shadow:0 6px 17px rgba(15,28,75,.045)}.dayLink b{display:block;font-size:14px}.dayLink span{display:block;margin-top:4px;font-size:9.5px;line-height:1.35;color:#667085}.dayLink:after{content:'›';position:absolute;right:17px;top:50%;transform:translateY(-50%);font-size:24px;color:#98a2b3}
.probe{margin:10px 0 0;text-align:center;font-size:9px;color:#98a2b3}
@media(max-width:480px){#atomicHome{padding:8px 8px 24px}.hero{min-height:108px}.hero picture,.hero img{min-height:108px}.modeGrid{gap:6px}.mode{min-height:74px}.modeIcon{width:36px;height:36px;font-size:20px}.today{grid-template-columns:30px repeat(3,minmax(0,1fr)) minmax(106px,1.25fr);gap:5px;padding:8px}.stat b{font-size:15px}.todayStart{font-size:10.5px}}
</style>
</head>
<body data-sayward-static="5.4.62">
<main id="atomicHome">
  <div class="shell">
    <section class="hero" aria-label="SAYWARD">
      <picture>
        <source srcset="home-hero.webp" type="image/webp">
        <img src="home-hero.png" alt="" width="941" height="296" decoding="async">
      </picture>
      <div class="heroFallback"><b>SAYWARD</b><span>말하는 순간, 더 오래 기억되는 영어</span></div>
      <span class="version">v5.4.62</span>
    </section>

    <nav class="modeGrid" aria-label="학습 모드">
      <a class="mode" href="sayward-app.html?mode=day"><span class="modeIcon">📚</span><b>DAY VOCA</b></a>
      <a class="mode" href="sayward-app.html?mode=my"><span class="modeIcon">🎯</span><b>MY 수업</b></a>
      <a class="mode" href="sayward-app.html?mode=sori"><span class="modeIcon">🎧</span><b>소리 영어</b></a>
      <a class="mode" href="sayward-app.html?mode=opic"><span class="modeIcon">🎤</span><b>OPIC</b></a>
    </nav>

    <a class="primary" href="sayward-app.html?action=overall&mode=day">
      <span class="play">▶</span><span><strong>전체 학습 반복</strong><small>선택한 학습을 반복 재생합니다</small></span>
    </a>

    <section class="today" aria-label="오늘 학습">
      <div class="todayLabel">오늘</div>
      <div class="stat"><b>—</b><span>학습</span></div>
      <div class="stat"><b>—</b><span>미학습</span></div>
      <div class="stat"><b>—</b><span>취약</span></div>
      <a class="todayStart" href="sayward-app.html?action=today&mode=day">오늘 학습 시작</a>
    </section>

    <a class="dayLink" href="sayward-app.html?mode=day"><b>📚 DAY별 학습</b><span>Day를 선택해 개별 학습하거나 연속 학습을 시작하세요.</span></a>
    <p class="probe">ATOMIC HOME · HTML/CSS only · no JavaScript</p>
  </div>
</main>
</body>
</html>
