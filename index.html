<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="sayward-build" content="v5.4.44-safe-boot">
<title>SAYWARD</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;background:#f6f8fc;color:#172033}
body{display:grid;place-items:center;min-height:100vh;padding:24px}.boot{width:min(430px,100%);background:#fff;border:1px solid #e6eaf0;border-radius:24px;padding:30px 24px;box-shadow:0 14px 40px rgba(25,50,90,.10);text-align:center}
.logo{width:66px;height:66px;margin:0 auto 16px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:900;font-size:24px;box-shadow:0 10px 26px rgba(37,99,235,.24)}
h1{margin:0;font-size:26px;letter-spacing:-.5px}.sub{margin:8px 0 22px;color:#667085;font-size:14px;line-height:1.5}.bar{height:10px;border-radius:999px;background:#edf1f7;overflow:hidden}.fill{height:100%;width:4%;border-radius:inherit;background:linear-gradient(90deg,#2563eb,#7c3aed);transition:width .18s ease}.status{margin-top:12px;color:#475467;font-size:12px;min-height:20px}.pct{font-weight:800;color:#2563eb}.retry{display:none;margin:18px auto 0;border:0;border-radius:12px;background:#2563eb;color:#fff;padding:11px 18px;font-weight:800;font-size:14px}.hint{margin-top:16px;color:#98a2b3;font-size:11px;line-height:1.5}
</style>
</head>
<body>
<main class="boot" aria-live="polite">
  <div class="logo">S</div>
  <h1>SAYWARD</h1>
  <p class="sub">첫 실행 안정화를 위해 학습 데이터를 순서대로 준비하고 있습니다.</p>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="status" id="status"><span class="pct">0%</span> · 준비 시작</div>
  <button class="retry" id="retry" type="button">다시 준비하기</button>
  <div class="hint">파일을 동시에 실행하지 않고 하나씩 준비한 뒤 앱을 엽니다.<br>두 번째 접속부터는 캐시되어 훨씬 빠르게 열립니다.</div>
</main>
<script>
(()=>{
'use strict';
const APP='sayward-app.html';
const ASSETS=[
  APP,
  'sayward-core.css',
  'sayward-home.css',
  'sayward-toefl-1.js',
  'sayward-toefl-2.js',
  'sayward-toefl-3.js',
  'sayward-toefl-4.js',
  'sayward-opic-1.js',
  'sayward-opic-2.js',
  'sayward-core.js',
  'MY_VOCA_MASTER.csv'
];
const fill=document.getElementById('fill'),status=document.getElementById('status'),retry=document.getElementById('retry');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function progress(done,total,label){
  const p=Math.max(0,Math.min(100,Math.round(done/total*100)));
  fill.style.width=Math.max(4,p)+'%';
  status.innerHTML=`<span class="pct">${p}%</span> · ${label}`;
}
async function warm(url,index,total){
  let lastErr;
  for(let attempt=1;attempt<=2;attempt++){
    try{
      const r=await fetch(url,{cache:'force-cache',credentials:'same-origin'});
      if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);
      if(r.body&&r.body.getReader){
        const reader=r.body.getReader();
        while(true){const x=await reader.read();if(x.done)break;}
      }else{await r.arrayBuffer();}
      return;
    }catch(e){lastErr=e;if(attempt<2)await sleep(220);}
  }
  throw new Error(`${url}: ${lastErr?.message||lastErr}`);
}
async function start(){
  retry.style.display='none';
  try{
    // If this tab has already successfully opened the app, resources are warm.
    if(sessionStorage.getItem('sayward_v544_app_loaded')==='1'){
      progress(100,100,'앱 여는 중');
      location.replace(APP);
      return;
    }
    for(let i=0;i<ASSETS.length;i++){
      progress(i,ASSETS.length,`준비 중 ${i+1}/${ASSETS.length}`);
      await warm(ASSETS[i],i,ASSETS.length);
      // Yield between large resources to avoid a cold-start memory/CPU spike on mobile Chrome.
      await sleep(i<ASSETS.length-1?90:40);
    }
    progress(ASSETS.length,ASSETS.length,'준비 완료 · 앱 여는 중');
    sessionStorage.setItem('sayward_v544_prepared','1');
    await sleep(120);
    location.replace(APP);
  }catch(e){
    console.error('[SAYWARD safe boot]',e);
    status.textContent='준비 중 오류가 발생했습니다. 아래 버튼으로 다시 시도해 주세요.';
    retry.style.display='inline-block';
  }
}
retry.addEventListener('click',start);
start();
})();
</script>
</body>
</html>
