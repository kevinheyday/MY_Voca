<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MY VOCA v5.3.97 Cache Reset</title></head>
<body style="font-family:sans-serif;padding:24px;line-height:1.6">
<h2>MY VOCA 캐시 초기화</h2><p id="status">초기화 중...</p>
<script>
(async()=>{
  const s=document.getElementById('status');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    Object.keys(localStorage).filter(k=>k.startsWith('mv_migrated_')).forEach(k=>localStorage.removeItem(k));
    s.innerHTML='완료되었습니다.<br>이 창을 닫고 MY VOCA 메인 페이지를 다시 여세요.';
  }catch(e){
    s.textContent='초기화 오류: '+e;
  }
})();
</script></body></html>
