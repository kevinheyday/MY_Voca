<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAYWARD v5.4.59 진단</title><style>body{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;margin:0;background:#f6f8fc;color:#172033}.w{max-width:760px;margin:auto;padding:20px}.c{background:#fff;border:1px solid #e6eaf0;border-radius:18px;padding:18px;box-shadow:0 8px 26px #10204012}h1{font-size:22px;margin:0 0 8px}p{color:#667085;line-height:1.55}button{border:0;border-radius:12px;background:#2563eb;color:#fff;padding:12px 16px;font-weight:800;font-size:15px}.row{padding:9px 0;border-bottom:1px solid #eef1f5;font:12px ui-monospace,SFMono-Regular,Consolas,monospace;word-break:break-all;white-space:pre-wrap}.ok{color:#067647}.bad{color:#b42318}.warn{color:#b54708}.muted{color:#667085}.head{font-weight:900;color:#344054;background:#f9fafb;padding:8px;margin-top:12px;border-radius:8px}.run{margin:10px 0;border:1px solid #e4e7ec;border-radius:12px;padding:10px}.run b{font-size:12px}.evt{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;padding:4px 0;border-top:1px dashed #eef1f5;word-break:break-all}</style></head><body><div class="w"><div class="c"><h1>SAYWARD 연결 진단 <span style="font-size:13px;color:#667085">v5.4.59</span></h1><p>STATIC GATE 구조를 검사합니다. v5.4.59는 첫 Home을 index.html의 HTML/CSS만으로 표시합니다. 학습 기능을 누르기 전에는 sayward-boot.js 로딩, localStorage 접근, 타이머, 데이터 fetch를 실행하지 않습니다.</p><button id="go">전체 검사 시작</button><div id="meta" class="row muted"></div><div id="out"></div></div></div><script>
const files=['version.txt','index.html','sayward-boot.js','sayward-home.html','sayward-deferred.html','sayward-core.css','sayward-patches.css','sayward-home.css','sayward-day-index.js','home-hero.png','drawer-header.png','sayward-day-01.json','sayward-day-02.json','sayward-day-03.json','sayward-day-04.json','sayward-day-05.json','sayward-day-06.json','sayward-day-07.json','sayward-day-08.json','sayward-day-09.json','sayward-day-10.json','sayward-day-11.json','sayward-opic-1.js','sayward-opic-2.js','sayward-core.js','sayward-patches.js'];
const $=x=>document.getElementById(x),out=$('out');
function row(text,cls=''){const d=document.createElement('div');d.className='row '+cls;d.textContent=text;out.appendChild(d);return d}
function head(t){const d=document.createElement('div');d.className='head';d.textContent=t;out.appendChild(d)}
function safeJson(s,fallback){try{return JSON.parse(s)}catch(e){return fallback}}
$('meta').textContent=`UA=${navigator.userAgent}\nonline=${navigator.onLine} | connection=${navigator.connection?.effectiveType||'n/a'} | downlink=${navigator.connection?.downlink||'n/a'}Mbps | saveData=${navigator.connection?.saveData||false}`;
$('go').onclick=async()=>{$('go').disabled=true;out.innerHTML='';
 head('1. 브라우저 상태');
 row(`time=${new Date().toISOString()}\nurl=${location.href}\nvisibility=${document.visibilityState}`,'muted');
 try{localStorage.setItem('__sw_diag__','1');localStorage.removeItem('__sw_diag__');row('localStorage read/write: OK','ok')}catch(e){row('localStorage: ERROR '+e,'bad')}
 try{sessionStorage.setItem('__sw_diag__','1');sessionStorage.removeItem('__sw_diag__');row('sessionStorage read/write: OK','ok')}catch(e){row('sessionStorage: ERROR '+e,'bad')}
 if(performance.memory)row(`JS heap: used ${(performance.memory.usedJSHeapSize/1048576).toFixed(1)} MB / limit ${(performance.memory.jsHeapSizeLimit/1048576).toFixed(0)} MB`,'muted');
 head('1-1. localStorage 사용량');
 try{const items=[];let total=0;for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);const v=String(localStorage.getItem(k)||'');const bytes=(k.length+v.length)*2;total+=bytes;items.push([k,bytes])}items.sort((a,b)=>b[1]-a[1]);row(`total ≈ ${(total/1024).toFixed(1)} KB | keys=${items.length}`,(total>3*1024*1024)?'bad':(total>1024*1024?'warn':'ok'));items.slice(0,15).forEach(([k,b])=>row(`${k} ≈ ${(b/1024).toFixed(1)} KB`,/^sayward_(boot|recovery|lazy|day|lean)/.test(k)?'muted':''));}catch(e){row('storage size scan ERROR '+e,'bad')}
 head('2. Service Worker / Cache (진단 페이지에서만 검사)');
 try{row('controller: '+(navigator.serviceWorker?.controller?.scriptURL||'NONE'),navigator.serviceWorker?.controller?'warn':'ok');const regs=await navigator.serviceWorker?.getRegistrations?.()||[];row('registrations: '+(regs.length?regs.map(r=>r.active?.scriptURL||r.installing?.scriptURL||r.waiting?.scriptURL||'?').join(' | '):'NONE'),regs.length?'warn':'ok')}catch(e){row('serviceWorker check ERROR '+e,'bad')}
 try{const keys=await caches.keys();const sk=keys.filter(k=>/^sayward/i.test(k));row('SAYWARD caches: '+(sk.length?sk.join(', '):'NONE'),sk.length?'warn':'ok')}catch(e){row('CacheStorage check ERROR '+e,'bad')}
 head('3. GitHub Pages 파일 응답 (cache:no-store)');
 for(const f of files){const d=row(f+' ...','muted');const t=performance.now();try{const r=await fetch(f+'?diag='+Date.now(),{cache:'no-store'});const b=await r.arrayBuffer();const ms=Math.round(performance.now()-t);d.className='row '+(r.ok?'ok':'bad');d.textContent=`${f} | HTTP ${r.status} | ${ms} ms | ${(b.byteLength/1024).toFixed(1)} KB | type=${r.headers.get('content-type')||''} | cache=${r.headers.get('cache-control')||''}`;}catch(e){d.className='row bad';d.textContent=`${f} | ERROR | ${Math.round(performance.now()-t)} ms | ${e}`;}await new Promise(r=>setTimeout(r,35));}
 head('4. STATIC GATE / 최근 SAYWARD 상태');
 try{const ss=localStorage.getItem('sayward_static_shell')||'NONE';row('sayward_static_shell = '+ss,ss.includes('5.4.59')?'ok':'muted');const fp=localStorage.getItem('sayward_first_paint')||'NONE';row('sayward_first_paint (구버전 기록일 수 있음) = '+fp,fp.includes('5.4.59')?'ok':'muted');row('sayward_home_summary_v1 = '+((localStorage.getItem('sayward_home_summary_v1')||'').length?((localStorage.getItem('sayward_home_summary_v1')||'').length+' chars'):'NONE'),'muted')}catch(e){}
 try{['sayward_boot_last','sayward_boot_error','sayward_boot_css','sayward_lean_hydration','sayward_lazy_profile','sayward_lazy_loader','sayward_day_loader'].forEach(k=>row(k+' = '+(localStorage.getItem(k)||'NONE'),'muted'))}catch(e){row('log read ERROR '+e,'bad')}
 head('5. 최근 STATIC GATE / ENHANCER TRACE');
 try{const hist=safeJson(localStorage.getItem('sayward_boot_history')||'[]',[]);if(!Array.isArray(hist)||!hist.length){row('history: NONE','muted')}else hist.slice(0,6).forEach((run,i)=>{const box=document.createElement('div');box.className='run';const home=run.finalHome||run.events?.[run.events.length-1]?.home||{};box.innerHTML=`<b>#${i+1} ${run.version||''} · ${run.fullReady?'FULL READY':run.shellReady?'SHELL READY':run.failed?'FAILED':'INCOMPLETE'} · ${run.id||''}</b><div class="evt">start=${run.startedAt||''} last=${run.lastStage||''} ${run.lastDetail||''} home.visible=${home.visible??'n/a'} shellReady=${run.shellReady??false} fullReady=${run.fullReady??false}</div>`;(run.events||[]).forEach(ev=>{const d=document.createElement('div');d.className='evt';const h=ev.home||{};d.textContent=`+${ev.elapsed??'?'}ms | ${ev.stage||''}${ev.detail?' · '+ev.detail:''} | vis=${ev.visibility||''} dom=${ev.domElements??''} heap=${ev.heapMB??''}MB | home=${h.visible??''} display=${h.display??''} ${h.w??''}x${h.h??''}`;box.appendChild(d)});out.appendChild(box)})}catch(e){row('history read ERROR '+e,'bad')}
 $('go').disabled=false;};
</script></body></html>
