<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAYWARD v5.4.61 진단</title><style>
body{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;margin:0;background:#f6f8fc;color:#172033}.w{max-width:780px;margin:auto;padding:20px}.c{background:#fff;border:1px solid #e6eaf0;border-radius:18px;padding:18px;box-shadow:0 8px 26px #10204012}h1{font-size:22px;margin:0 0 8px}p{color:#667085;line-height:1.55}button{border:0;border-radius:12px;background:#2563eb;color:#fff;padding:12px 16px;font-weight:800;font-size:14px;margin:4px 6px 4px 0}button.secondary{background:#475467}button:disabled{opacity:.55}.row{padding:9px 0;border-bottom:1px solid #eef1f5;font:12px ui-monospace,SFMono-Regular,Consolas,monospace;word-break:break-all;white-space:pre-wrap}.ok{color:#067647}.bad{color:#b42318}.warn{color:#b54708}.muted{color:#667085}.head{font-weight:900;color:#344054;background:#f9fafb;padding:8px;margin-top:12px;border-radius:8px}.run{margin:10px 0;border:1px solid #e4e7ec;border-radius:12px;padding:10px}.run b{font-size:12px}.evt{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;padding:4px 0;border-top:1px dashed #eef1f5;word-break:break-all}.summary{margin:10px 0;padding:11px 12px;border-radius:12px;background:#f8fafc;font-weight:800;font-size:13px}
</style></head><body><div class="w"><div class="c"><h1>SAYWARD 연결 진단 <span style="font-size:13px;color:#667085">v5.4.61</span></h1><p>FAIL CAPTURE + MODULE ISOLATION 구조를 검사합니다. 첫 Home(index.html)은 JavaScript·storage·timer·fetch가 0개이며, 앱 진입 후에는 각 로딩 단계의 마지막 성공/실패 지점을 즉시 저장합니다.</p><button id="go">빠른 전체 검사</button><button id="deep" class="secondary">대용량 실제 다운로드 검사</button><a href="isolation.html" style="display:inline-block;margin:4px 6px 4px 0;padding:12px 16px;border-radius:12px;background:#7c3aed;color:#fff;text-decoration:none;font-weight:800;font-size:14px">모듈 격리 검사</a><div id="meta" class="row muted"></div><div id="out"></div></div></div><script>
const EXPECTED_VERSION='v5.4.61',EXPECTED_BUILD='20261008-v5.4.61-fail-capture-isolation';
const files=['version.txt','index.html','sayward-app.html','sayward-boot.js','sayward-home.html','sayward-deferred.html','sayward-core.css','sayward-patches.css','sayward-home.css','sayward-day-index.js','home-hero.webp','home-hero.png','drawer-header.webp','drawer-header.png','sayward-day-01.json','sayward-day-02.json','sayward-day-03.json','sayward-day-04.json','sayward-day-05.json','sayward-day-06.json','sayward-day-07.json','sayward-day-08.json','sayward-day-09.json','sayward-day-10.json','sayward-day-11.json','sayward-opic-1.js','sayward-opic-2.js','sayward-core.js','sayward-patches.js','recovery.html','sw.js','isolation.html'];
const $=x=>document.getElementById(x),out=$('out');
function row(text,cls=''){const d=document.createElement('div');d.className='row '+cls;d.textContent=text;out.appendChild(d);return d}
function head(t){const d=document.createElement('div');d.className='head';d.textContent=t;out.appendChild(d)}
function safeJson(s,f){try{return JSON.parse(s)}catch(e){return f}}
function bytesFromHeaders(r){const n=Number(r.headers.get('content-length')||0);return Number.isFinite(n)?n:0}
function currentTrace(run){return String(run?.version||'').replace(/^v/,'')==='5.4.61'||String(run?.build||'')===EXPECTED_BUILD}
$('meta').textContent=`UA=${navigator.userAgent}
online=${navigator.onLine} | connection=${navigator.connection?.effectiveType||'n/a'} | downlink=${navigator.connection?.downlink||'n/a'}Mbps | saveData=${navigator.connection?.saveData||false}`;
async function getText(file){const r=await fetch(file+'?diag='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return {r,text:await r.text()}}
async function headFile(file){const t=performance.now();const r=await fetch(file+'?diag='+Date.now(),{method:'HEAD',cache:'no-store'});return {r,ms:Math.round(performance.now()-t),bytes:bytesFromHeaders(r)}}
$('go').onclick=async()=>{$('go').disabled=true;$('deep').disabled=true;out.innerHTML='';let gatePass=false,buildPass=false,headPass=true;
head('1. 브라우저 상태');row(`time=${new Date().toISOString()}
url=${location.href}
visibility=${document.visibilityState}`,'muted');try{localStorage.setItem('__sw_diag__','1');localStorage.removeItem('__sw_diag__');row('localStorage read/write: OK','ok')}catch(e){row('localStorage: ERROR '+e,'bad')}try{sessionStorage.setItem('__sw_diag__','1');sessionStorage.removeItem('__sw_diag__');row('sessionStorage read/write: OK','ok')}catch(e){row('sessionStorage: ERROR '+e,'bad')}if(performance.memory)row(`JS heap: used ${(performance.memory.usedJSHeapSize/1048576).toFixed(1)} MB / limit ${(performance.memory.jsHeapSizeLimit/1048576).toFixed(0)} MB`,'muted');
head('2. 현재 배포 빌드 확인');try{const [idx,ver,app]=await Promise.all([getText('index.html'),getText('version.txt'),getText('sayward-app.html')]);const meta=idx.text.match(/<meta\s+name=["']sayward-build["']\s+content=["']([^"']+)/i)?.[1]||'NONE';const body=idx.text.match(/<body[^>]*data-sayward-static=["']([^"']+)/i)?.[1]||'NONE';const appMeta=app.text.match(/<meta\s+name=["']sayward-build["']\s+content=["']([^"']+)/i)?.[1]||'NONE';buildPass=meta===EXPECTED_BUILD&&appMeta===EXPECTED_BUILD&&ver.text.includes('build='+EXPECTED_BUILD);row(`index build=${meta} | app build=${appMeta} | staticVersion=${body}`,buildPass?'ok':'bad');row(ver.text.trim(),buildPass?'ok':'warn')}catch(e){row('build check ERROR '+e,'bad')}
head('3. NATIVE GATE 계약 검사');try{const {text}=await getText('index.html');const scripts=(text.match(/<script\b/gi)||[]).length,handlers=(text.match(/\son[a-z]+\s*=/gi)||[]).length,storage=(text.match(/localStorage|sessionStorage/gi)||[]).length,timers=(text.match(/setTimeout|setInterval|requestAnimationFrame|requestIdleCallback/gi)||[]).length,fetches=(text.match(/\bfetch\s*\(/gi)||[]).length,nativeLinks=(text.match(/href=["']sayward-app\.html/gi)||[]).length,directBoot=(text.match(/<script[^>]+sayward-boot\.js/gi)||[]).length;gatePass=scripts===0&&handlers===0&&storage===0&&timers===0&&fetches===0&&directBoot===0&&nativeLinks>=9;row(`scripts=${scripts} | inlineHandlers=${handlers} | storageRefs=${storage} | timerRefs=${timers} | fetchRefs=${fetches} | directBoot=${directBoot} | nativeAppLinks=${nativeLinks}`,gatePass?'ok':'bad');row(gatePass?'STATIC GATE PASS — 첫 Home은 브라우저 정적 렌더링만 사용합니다.':'STATIC GATE FAIL — index.html 계약을 다시 확인하세요.',gatePass?'ok':'bad')}catch(e){row('index contract ERROR '+e,'bad')}
head('4. Service Worker / Cache');try{row('controller: '+(navigator.serviceWorker?.controller?.scriptURL||'NONE'),navigator.serviceWorker?.controller?'warn':'ok');const regs=await navigator.serviceWorker?.getRegistrations?.()||[];row('registrations: '+(regs.length?regs.map(r=>r.active?.scriptURL||r.installing?.scriptURL||r.waiting?.scriptURL||'?').join(' | '):'NONE'),regs.length?'warn':'ok')}catch(e){row('serviceWorker check ERROR '+e,'bad')}try{const keys=await caches.keys(),sk=keys.filter(k=>/^sayward/i.test(k));row('SAYWARD caches: '+(sk.length?sk.join(', '):'NONE'),sk.length?'warn':'ok')}catch(e){row('CacheStorage check ERROR '+e,'bad')}
head('5. 파일 존재/헤더 검사 — HEAD만 사용');for(const f of files){const d=row(f+' ...','muted');try{const x=await headFile(f),r=x.r;headPass=headPass&&r.ok;d.className='row '+(r.ok?'ok':'bad');d.textContent=`${f} | HEAD ${r.status} | ${x.ms} ms | ${x.bytes?((x.bytes/1024).toFixed(1)+' KB'):'size n/a'} | type=${r.headers.get('content-type')||''} | cache=${r.headers.get('cache-control')||''}`;}catch(e){headPass=false;d.className='row bad';d.textContent=`${f} | HEAD ERROR | ${e}`;}}
head('6. localStorage 사용량 — 앱 데이터는 읽기만 함');try{const items=[];let total=0;for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i),v=String(localStorage.getItem(k)||''),b=(k.length+v.length)*2;total+=b;items.push([k,b])}items.sort((a,b)=>b[1]-a[1]);row(`total ≈ ${(total/1024).toFixed(1)} KB | keys=${items.length}`,total>3*1024*1024?'bad':total>1024*1024?'warn':'ok');items.slice(0,15).forEach(([k,b])=>row(`${k} ≈ ${(b/1024).toFixed(1)} KB`,(k==='mv_unified_stats'||k==='d1stats')?'warn':'muted'));const big=items.filter(([k])=>k==='mv_unified_stats'||k==='d1stats').reduce((s,[,b])=>s+b,0);if(total&&big)row(`mv_unified_stats + d1stats share ≈ ${(big/total*100).toFixed(1)}% · 첫 Home에서는 접근하지 않음`,'warn')}catch(e){row('storage size scan ERROR '+e,'bad')}
head('7. 현재 v5.4.61 APP TRACE');try{const hist=safeJson(localStorage.getItem('sayward_boot_history')||'[]',[]),current=Array.isArray(hist)?hist.filter(currentTrace):[],legacy=Array.isArray(hist)?hist.filter(x=>!currentTrace(x)):[];if(!current.length)row('현재 v5.4.61 APP TRACE: NONE — 아직 sayward-app.html을 실행하지 않았으면 정상입니다.','muted');else current.slice(0,4).forEach((run,i)=>{const box=document.createElement('div');box.className='run';const home=run.finalHome||run.events?.[run.events.length-1]?.home||{};box.innerHTML=`<b>#${i+1} v5.4.61 · ${run.fullReady?'FULL READY':run.shellReady?'SHELL READY':run.failed?'FAILED':'INCOMPLETE'} · ${run.id||''}</b><div class="evt">last=${run.lastStage||''} ${run.lastDetail||''} home.visible=${home.visible??'n/a'} shellReady=${run.shellReady??false} fullReady=${run.fullReady??false}</div>`;(run.events||[]).slice(-20).forEach(ev=>{const d=document.createElement('div');d.className='evt';d.textContent=`+${ev.elapsed??'?'}ms | ${ev.stage||''}${ev.detail?' · '+ev.detail:''}`;box.appendChild(d)});out.appendChild(box)});row(`legacy trace entries hidden=${legacy.length} (이전 빌드 기록은 현재 빌드 판정에 사용하지 않음)`,'muted')}catch(e){row('history read ERROR '+e,'bad')}
head('8. FAIL CAPTURE — 마지막 성공/실패 지점');try{const pre=safeJson(localStorage.getItem('sayward_preboot_sentinel_v1')||'null',null),c=safeJson(localStorage.getItem('sayward_fail_capture_v2')||'null',null),ch=safeJson(localStorage.getItem('sayward_fail_capture_history_v2')||'[]',[]);if(pre){const linked=!!c&&pre.id===c.prebootId;row(`preboot sentinel | ${new Date(pre.at||0).toISOString()} | boot linked=${linked}`,linked?'ok':'bad');if(!linked)row('최근 sayward-app.html은 열렸지만 같은 시도의 sayward-boot.js 시작 기록이 없습니다. → BOOT SCRIPT 시작 전 실패 후보','bad')}if(!c)row('FAIL Capture: NONE — 아직 v5.4.61 앱을 실행하지 않았거나 boot.js 시작 전에 멈췄을 수 있습니다.','muted');else{const same=String(c.build||'')===EXPECTED_BUILD;row(`current capture | build=${c.build||''} | result=${c.result||''} | complete=${!!c.complete} | isolation=${c.isolationStage??'normal'} | last=${c.lastStage||''} / ${c.lastStatus||''}`,c.result==='FAIL'?'bad':same?'ok':'warn');if(c.detail)row('detail='+c.detail,c.result==='FAIL'?'bad':'muted');(c.events||[]).slice(-16).forEach(ev=>row(`+${ev.elapsed??'?'}ms | ${ev.status||''} | ${ev.stage||''}${ev.detail?' · '+ev.detail:''}${ev.error?' · ERROR='+ev.error:''}`,ev.status==='FAIL'?'bad':'muted'));}if(Array.isArray(ch)&&ch.length)row(`capture history=${ch.length}개 보존 · 최근 실패=${ch.filter(x=>x?.result==='FAIL').length}개`,'muted')}catch(e){row('FAIL capture read ERROR '+e,'bad')}
    const s=document.createElement('div');s.className='summary '+(gatePass&&buildPass&&headPass?'ok':'warn');s.textContent=gatePass&&buildPass&&headPass?'RESULT: NATIVE GATE / CURRENT BUILD / FILE HEAD CHECK 모두 PASS':'RESULT: 일부 항목 확인 필요 — 위 BAD/WARN 항목을 확인하세요.';out.prepend(s);$('go').disabled=false;$('deep').disabled=false;};
$('deep').onclick=async()=>{$('deep').disabled=true;head('대용량 실제 다운로드 검사 — 수동 실행');let total=0;for(const f of files){const d=row(f+' ...','muted'),t=performance.now();try{const r=await fetch(f+'?deep='+Date.now(),{cache:'no-store'}),b=await r.arrayBuffer(),ms=Math.round(performance.now()-t);total+=b.byteLength;d.className='row '+(r.ok?'ok':'bad');d.textContent=`${f} | GET ${r.status} | ${ms} ms | ${(b.byteLength/1024).toFixed(1)} KB`;}catch(e){d.className='row bad';d.textContent=`${f} | GET ERROR | ${e}`;}}row(`deep download total ≈ ${(total/1048576).toFixed(2)} MB`,'warn');$('deep').disabled=false;};
</script></body></html>
