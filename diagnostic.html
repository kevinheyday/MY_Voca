<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAYWARD v5.4.45 진단</title><style>body{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;margin:0;background:#f6f8fc;color:#172033}.w{max-width:720px;margin:auto;padding:24px}.c{background:#fff;border:1px solid #e6eaf0;border-radius:18px;padding:18px;box-shadow:0 8px 26px #10204012}h1{font-size:22px;margin:0 0 8px}p{color:#667085;line-height:1.55}button{border:0;border-radius:12px;background:#2563eb;color:#fff;padding:12px 16px;font-weight:800;font-size:15px}.row{padding:9px 0;border-bottom:1px solid #eef1f5;font:13px ui-monospace,SFMono-Regular,Consolas,monospace;word-break:break-all}.ok{color:#067647}.bad{color:#b42318}.muted{color:#667085}</style></head><body><div class="w"><div class="c"><h1>SAYWARD 연결 진단 <span style="font-size:13px;color:#667085">v5.4.45</span></h1><p>이 페이지는 앱 코드를 실행하지 않고 GitHub Pages에서 각 파일이 얼마나 빨리 내려오는지만 검사합니다.</p><button id="go">검사 시작</button><div id="meta" class="row muted"></div><div id="out"></div></div></div><script>const files=['index.html','sayward-core.css','sayward-patches.css','sayward-home.css','home-hero.png','drawer-header.png','sayward-toefl-1.js','sayward-toefl-2.js','sayward-toefl-3.js','sayward-toefl-4.js','sayward-opic-1.js','sayward-opic-2.js','sayward-core.js','sayward-patches.js'];const $=x=>document.getElementById(x);$('meta').textContent=`${navigator.userAgent} | online=${navigator.onLine} | connection=${navigator.connection?.effectiveType||'n/a'}`;$('go').onclick=async()=>{$('go').disabled=true;$('out').innerHTML='';for(const f of files){const d=document.createElement('div');d.className='row';d.textContent=f+' ...';$('out').appendChild(d);const t=performance.now();try{const r=await fetch(f+'?diag='+Date.now(),{cache:'no-store'});const b=await r.arrayBuffer();const ms=Math.round(performance.now()-t);d.className='row '+(r.ok?'ok':'bad');d.textContent=`${f} | HTTP ${r.status} | ${ms} ms | ${(b.byteLength/1024).toFixed(1)} KB`;}catch(e){d.className='row bad';d.textContent=`${f} | ERROR | ${Math.round(performance.now()-t)} ms | ${e}`;}await new Promise(r=>setTimeout(r,80));}$('go').disabled=false;};</script></body></html>
